services:
  - type: web
    name: gestion-notes
    env: php
    region: oregon
    branch: main
    plan: free
    buildCommand: |
      composer install --no-interaction --prefer-dist --optimize-autoloader
      npm install --ignore-scripts
      npm run build
    startCommand: |
      if [ -z "$APP_KEY" ]; then
        php artisan key:generate --force
      fi
      php artisan migrate --force
      php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: CACHE_DRIVER
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: VITE_APP_NAME
        value: "Gestion Notes"
