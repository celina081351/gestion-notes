version: '3.8'

services:

  # ─── Application PHP/Laravel ───────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestion_notes_app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gestion_notes
      DB_USERNAME: laravel
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    networks:
      - gestion_net
    depends_on:
      db:
        condition: service_healthy

  # ─── Serveur web Nginx ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: gestion_notes_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - gestion_net
    depends_on:
      - app

  # ─── Base de données MySQL ─────────────────────────────────
  db:
    image: mysql:8.0
    container_name: gestion_notes_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gestion_notes
      MYSQL_USER: laravel
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - gestion_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
    driver: local

networks:
  gestion_net:
    driver: bridge
